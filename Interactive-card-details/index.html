<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-256.png" />
        <title>Interactive card details form</title>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <div class="col part-lift">
                    <div class="card-front">
                        <div class="logo">
                            <img src="./src/assets/card-logo.svg" alt="" />
                        </div>
                        <p class="card-number">0000 0000 0000 0000</p>
                        <div class="bottom-card-front">
                            <h6 class="card-holder-name">JANE APPLESEED</h6>
                            <p class="card-exp-date">00/00</p>
                        </div>
                    </div>
                    <div class="card-back">
                        <p class="card-cvc">000</p>
                    </div>
                </div>

                <div class="col part-right">
                    <div class="card-form-container">
                        <form>
                            <div class="mb-3">
                                <label for="cardholder-name" class="form-label form-label-custom">CARDHOLDER NAME</label>
                                <input type="text" class="form-control form-control-custom" id="cardholder-name" placeholder="e.g. Jane Appleseed" />
                                <div class="message-error"></div>
                            </div>
                            <div class="mb-3">
                                <label for="card-number" class="form-label form-label-custom">CARD NUMBER</label>
                                <input type="text" class="form-control form-control-custom" id="card-number" placeholder="e.g. 1234 5678 9123 0000" maxlength="19" />
                                <div class="message-error"></div>
                            </div>
                            <div class="row mb-4">
                                <div class="col-6">
                                    <label for="exp-date" class="form-label form-label-custom">EXP. DATE (MM/YY)</label>
                                    <div class="row">
                                        <div class="col">
                                            <input type="text" class="form-control form-control-custom" id="monthly" placeholder="MM" maxlength="2" />
                                            <div class="message-error"></div>
                                        </div>
                                        <div class="col">
                                            <input type="text" class="form-control form-control-custom" id="day" placeholder="YY" maxlength="2" />
                                            <div class="message-error"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label for="cvc" class="form-label form-label-custom">CVC</label>
                                    <input type="text" class="form-control form-control-custom" id="cvc" placeholder="e.g. 123" maxlength="3" />
                                    <div class="message-error"></div>
                                </div>
                            </div>
                            <button type="submit" class="btn-custom w-100">Confirm</button>
                        </form>
                    </div>

                    <div class="page-complete text-center d-none">
                        <img src="./src/assets/icon-complete.svg" alt="Complete Icon" />
                        <h2 class="my-3 fw-bold">Thank you!</h2>
                        <p>We've added your card details</p>
                        <button class="btn-custom">Continue</button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
