<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <link rel="stylesheet" href="./css/style.css" />
        <title>Entertainment web app</title>
        <style>
            main {
                grid-template-columns: repeat(auto-fit, 250px);
            }
            @media (max-width: 375px) {
                main {
                    grid-template-columns: repeat(auto-fit, 100%);
                }
            }
            @media (max-width: 768px) {
                main {
                    grid-template-columns: repeat(auto-fit, 345px);
                }
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row home-page">
                <div class="col-12 col-md-1 page-top">
                    <div class="sidebar">
                        <div class="box-sidebar">
                            <img src="./assets/logo.svg" alt="" />
                            <div class="icon-sidebar">
                                <a href="./index.html">
                                    <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M8 0H1C.4 0 0 .4 0 1v7c0 .6.4 1 1 1h7c.6 0 1-.4 1-1V1c0-.6-.4-1-1-1Zm0 11H1c-.6 0-1 .4-1 1v7c0 .6.4 1 1 1h7c.6 0 1-.4 1-1v-7c0-.6-.4-1-1-1ZM19 0h-7c-.6 0-1 .4-1 1v7c0 .6.4 1 1 1h7c.6 0 1-.4 1-1V1c0-.6-.4-1-1-1Zm0 11h-7c-.6 0-1 .4-1 1v7c0 .6.4 1 1 1h7c.6 0 1-.4 1-1v-7c0-.6-.4-1-1-1Z"
                                            fill="#5A698F"
                                        />
                                    </svg>
                                </a>
                                <a href="./movies.html">
                                    <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M16.956 0H3.044A3.044 3.044 0 0 0 0 3.044v13.912A3.044 3.044 0 0 0 3.044 20h13.912A3.044 3.044 0 0 0 20 16.956V3.044A3.044 3.044 0 0 0 16.956 0ZM4 9H2V7h2v2Zm-2 2h2v2H2v-2Zm16-2h-2V7h2v2Zm-2 2h2v2h-2v-2Zm2-8.26V4h-2V2h1.26a.74.74 0 0 1 .74.74ZM2.74 2H4v2H2V2.74A.74.74 0 0 1 2.74 2ZM2 17.26V16h2v2H2.74a.74.74 0 0 1-.74-.74Zm16 0a.74.74 0 0 1-.74.74H16v-2h2v1.26Z"
                                            fill="#5A698F"
                                        />
                                    </svg>
                                </a>
                                <a href="./tv-series.html">
                                    <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M20 4.481H9.08l2.7-3.278L10.22 0 7 3.909 3.78.029 2.22 1.203l2.7 3.278H0V20h20V4.481Zm-8 13.58H2V6.42h10v11.64Zm5-3.88h-2v-1.94h2v1.94Zm0-3.88h-2V8.36h2v1.94Z" fill="#5A698F" /></svg>
                                </a>
                                <a href="./bookmarked.html">
                                    <svg width="17" height="20" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M15.387 0c.202 0 .396.04.581.119.291.115.522.295.694.542.172.247.258.52.258.82v17.038c0 .3-.086.573-.258.82a1.49 1.49 0 0 1-.694.542 1.49 1.49 0 0 1-.581.106c-.423 0-.79-.141-1.098-.423L8.46 13.959l-5.83 5.605c-.317.29-.682.436-1.097.436-.202 0-.396-.04-.581-.119a1.49 1.49 0 0 1-.694-.542A1.402 1.402 0 0 1 0 18.52V1.481c0-.3.086-.573.258-.82A1.49 1.49 0 0 1 .952.119C1.137.039 1.33 0 1.533 0h13.854Z"
                                            fill="#5A698F"
                                        />
                                    </svg>
                                </a>
                            </div>
                        </div>
                        <div class="registration">
                            <a href="./login.html">Login</a>
                            <a href="./sign-up.html">Sign up</a>
                        </div>
                        <div class="dropend profile d-none">
                            <img src="./assets/image-avatar.png" data-bs-toggle="dropdown" />
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="./login.html">Login</a></li>
                                <li><a class="dropdown-item" href="./sign-up.html">Sign up</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-11 page-bottom">
                    <div class="icon-search">
                        <input type="search" placeholder="Search for bookmarked shows" id="searchInput" onkeyup="performLiveSearch()" />
                    </div>

                    <div class="mt-5">
                        <header>
                            <h4>Bookmarked Movies</h4>
                        </header>
                        <main class="bookmarked-movies-container card-grid"></main>
                    </div>

                    <div class="mt-5">
                        <header>
                            <h4>Bookmarked TV Series</h4>
                        </header>
                        <main class="bookmarked-tv-series-container card-grid"></main>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script type="module" src="./js/pages/bookmarked.js"></script>
        <script src="./js/utils.js"></script>
    </body>
</html>
